name: X1
run-name: ${{ github.actor }} is learning GitHub Actions
on: 
  # push:
  # pull_request:
  workflow_dispatch:

jobs:
  build-ubuntu2204-x86-64:
    # runs-on: ubuntu-latest
    runs-on: ubuntu-22.04
    steps:
      
      - name: Check system environment
        run: |
          echo "now=$(TZ="Asia/Hong_Kong" date +%Y%m%d-%H%M%S)" >> $GITHUB_ENV
          echo -e "\nThe Current Folder                     : $(pwd) \n"
          ls -al
          echo -e "\nThe path of GITHUB_ENV                 : "
          echo $GITHUB_ENV
          echo -e "\nThe variable of GITHUB_ENV : "
          cat $GITHUB_ENV
          echo -e "\nThe variable of PATH : "
          echo $PATH



