name: Testing Windows x86-64
run-name: Testing Windows
on:
  workflow_dispatch:

jobs:
  Testing-0:
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - name: Set default environment variables for Windows
        run: |
          $now = Get-Date -Format "yyyyMMdd-HHmmss"
          echo "now=$now" >> $GITHUB_ENV

      - name: Check Environment 0
        run: |
          echo "`nThe current time: $env:now "
          echo "`nCurrent Folder : $(pwd)"
          ls
          echo "The path of GITHUB_ENV : $env:GITHUB_ENV `n"
          echo "The content of GITHUB_ENV : `n"
          cat $env:GITHUB_ENV

      - name: Check Environment 1
        run: |
          cmake --version
          cmake --help