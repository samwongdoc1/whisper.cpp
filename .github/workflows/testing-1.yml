name: Testing Windows x86-64
run-name: Testing Windows
on:
  workflow_dispatch:

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  Testing-0:
    permissions:
      contents: write
    runs-on: windows-2022
    steps:
      - name: Set default environment variables for Windows
        run: |
          echo "CMAKE_BUILD_TYPE=${{ inputs.cmake_build_type || 'Release' }}" >> $GITHUB_ENV
          $TimeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("Asia/Hong_Kong")
          echo "TimeZone=$TimeZone" >> $GITHUB_ENV
          $now = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), $TimeZone.Id).ToString("yyyyMMdd-HHmmss")
          echo "now=$now" >> $GITHUB_ENV 
        # $now = Get-Date -Format "yyyyMMdd-HHmmss" -UFormat "%Z"
        # echo "now=$now"


      - name: Check Environment 0
        run: |
          echo "`nThe current time: ${{ env.now }} "
          echo "`nCurrent Folder : $(pwd)"
          ls
          echo "`nThe path of GITHUB_ENV : $env:GITHUB_ENV `n"
          echo "`nThe variable of GITHUB_ENV : `n"
          cat $env:GITHUB_ENV
          echo "`nThe variable of PATH"
          echo $env:PATH

      - name: Check Environment 1
        run: |
          cmake --version
          cmake --help